# TLS is terminated by Cloudflare; nginx only speaks HTTP on :80.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Re-resolve container IPs (they change when a service is recreated) and let
    # nginx start even if a backend is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;
    set $web_upstream http://web:3000;

    client_max_body_size 100m;   # attachments (Cloudflare caps requests at 100 MB anyway)

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SignalR (WebSocket)
    location /hubs/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location /swagger {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
